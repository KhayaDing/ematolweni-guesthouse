# PROPOSED ONLY. Ask the host to confirm Apache-compatible .htaccess directives,
# AllowOverride and mod_headers/LiteSpeed support; merge into the existing config.
# Do not overwrite existing redirects, security headers, handlers, or access rules.
<IfModule mod_headers.c>
  <FilesMatch "\.[a-f0-9]{16}\.(avif|webp|jpg|jpeg|png|svg|mp4|css|js)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>
  <FilesMatch "\.(html|json)$">
    Header set Cache-Control "no-cache"
  </FilesMatch>
</IfModule>
# Confirm that / and directory index responses also receive no-cache.
# Configure image/avif and image/webp MIME types if the host does not serve them.
# Do not add a global immutable rule for /assets/: unhashed source URLs can change.
