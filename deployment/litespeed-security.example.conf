# PROPOSED ONLY: owner/host must confirm LiteSpeed/Apache directive support.
# Merge with existing configuration; do not overwrite handlers/redirects/ACME rules.
# Primary protection: deploy only dist and remove old development files from web root.
Options -Indexes
<FilesMatch "(?i)(^\.|\.(md|cjs|mjs|ts|toml|ya?ml|lock|map|log|bak|key|pem)$|^(package(-lock)?\.json|pnpm-workspace\.yaml)$)">
    Require all denied
</FilesMatch>
# Match development directories, but deliberately do not deny .well-known resources.
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteRule (^|/)(src|scripts|tests|node_modules|deployment|\.git|\.netlify|\.maintenance|\.performance|\.vscode|test-results|playwright-report)(/|$) - [F,L,NC]
</IfModule>
# Configure the site's /404.html as the error document using the host's control panel.
