<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - EMatolweni Guesthouse</title>
    <link rel="stylesheet" href="css/styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&amp;family=Nunito:wght@300;400;600;700&amp;display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" sizes="180x180" href="assets/images/logos/brownlogo-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <header class="site-header">
        {{header}}
    </header>

    <main>
        <section class="section"

            <div class="container">
                <h1
                    style="font-family: 'Playfair Display', serif; font-size: 5rem; margin-bottom: 0.5rem; color: #3b2718;">
                    404</h1>
                <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem; color: #6c5a4d;">Page Not Found</h2>
                <p style="max-width: 500px; margin: 0 auto 2rem; color: #4b3b32;">
                    Oops! It seems the page you are looking for has been moved or doesn't exist.
                </p>
                <a href="index.html" class="btn-primary">Back to Home</a>
            </div>
        </section>
    </main>

    {{footer}}

    <script src="js/script.js"></script>

</html>
